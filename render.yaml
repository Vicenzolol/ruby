# render.yaml — Render Blueprint (Infrastructure as Code)
# Documentação: https://render.com/docs/blueprint-spec
#
# Para fazer deploy:
#   1. Crie uma conta em https://render.com
#   2. Conecte este repositório Git
#   3. Crie um novo Blueprint apontando para este arquivo
#   4. Adicione manualmente o secret RAILS_MASTER_KEY no painel do Render
#      (valor em kanbanflow/config/master.key — NÃO comite esse arquivo)
#
# Variáveis automáticas do Render (não precisam ser declaradas aqui):
#   RENDER_EXTERNAL_URL — URL pública do serviço (ex: https://kanbanflow.onrender.com)
#   RENDER_SERVICE_NAME — nome do serviço
#   RENDER_GIT_COMMIT   — SHA do commit deployado

services:
  - type: web
    name: kanbanflow
    runtime: ruby
    # rootDir define o diretório de trabalho para build e start (monorepo)
    rootDir: kanbanflow
    plan: free
    region: oregon
    buildCommand: bin/render-build.sh
    startCommand: bin/rails server
    healthCheckPath: /up
    envVars:
      # RAILS_MASTER_KEY: configure como "secret" no painel do Render.
      # NÃO coloque o valor aqui — o campo sync:false indica que é gerenciado manualmente.
      - key: RAILS_MASTER_KEY
        sync: false
      # DATABASE_URL é injetado automaticamente pelo banco configurado abaixo.
      - key: DATABASE_URL
        fromDatabase:
          name: kanbanflow-db
          property: connectionString
      - key: RAILS_LOG_TO_STDOUT
        value: "enabled"
      # Limitar Puma workers para evitar OOM no free tier (512 MB RAM)
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"

databases:
  - name: kanbanflow-db
    plan: free
    region: oregon
    databaseName: kanbanflow_production
