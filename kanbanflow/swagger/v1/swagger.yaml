---
openapi: 3.0.1
info:
  title: KanbanFlow API V1
  version: v1
  description: |
    API REST para gerenciamento de projetos e tarefas Kanban.
    Autenticação via Bearer token — obtenha o token em `GET /api/v1/me`.
    Todos os endpoints de listagem suportam paginação via `?page=` e `?per_page=`.
paths:
  "/api/v1/projects":
    get:
      summary: Lista projetos do usuário autenticado (paginado)
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        required: false
        description: Número da página
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
        required: false
        description: Itens por página (máx. 100)
      responses:
        '200':
          description: lista de projetos com metadados de paginação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Project"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
        '401':
          description: não autorizado — token ausente ou inválido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Cria um novo projeto
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: projeto criado com sucesso
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectWithTasks"
        '422':
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: não autorizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Novo Projeto
                    description:
                      type: string
                      example: Descrição opcional
                    color:
                      type: string
                      example: "#3b82f6"
                  required:
                  - name
  "/api/v1/projects/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
      description: ID do projeto
    get:
      summary: Exibe um projeto com suas tarefas
      tags:
      - Projects
      security:
      - bearerAuth: []
      responses:
        '200':
          description: projeto com lista de tarefas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectWithTasks"
        '404':
          description: projeto não encontrado ou pertence a outro usuário
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: não autorizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Atualiza um projeto
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: projeto atualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectWithTasks"
        '422':
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: projeto não encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    color:
                      type: string
    delete:
      summary: Remove um projeto e suas tarefas
      tags:
      - Projects
      security:
      - bearerAuth: []
      responses:
        '204':
          description: projeto removido com sucesso
        '404':
          description: projeto não encontrado
  "/api/v1/projects/{project_id}/tasks":
    parameters:
    - name: project_id
      in: path
      schema:
        type: integer
      required: true
      description: ID do projeto
    get:
      summary: Lista tarefas do projeto (paginado, filtrável por status)
      tags:
      - Tasks
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - todo
          - in_progress
          - done
        required: false
        description: Filtra por status da coluna Kanban
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        required: false
        description: Número da página
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
        required: false
        description: Itens por página (máx. 100)
      responses:
        '200':
          description: lista de tarefas com metadados de paginação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Task"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
        '401':
          description: não autorizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: projeto não encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Cria uma tarefa no projeto
      tags:
      - Tasks
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: tarefa criada com sucesso
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '422':
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: não autorizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    title:
                      type: string
                      example: Implementar login
                    description:
                      type: string
                      example: Descrição opcional
                    status:
                      type: string
                      enum:
                      - todo
                      - in_progress
                      - done
                      example: todo
                  required:
                  - title
  "/api/v1/tasks/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
      description: ID da tarefa
    get:
      summary: Exibe uma tarefa
      tags:
      - Tasks
      security:
      - bearerAuth: []
      responses:
        '200':
          description: tarefa encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '404':
          description: tarefa não encontrada ou de outro usuário
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Atualiza uma tarefa (inclusive move entre colunas via status)
      tags:
      - Tasks
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: tarefa atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '422':
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: tarefa não encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    status:
                      type: string
                      enum:
                      - todo
                      - in_progress
                      - done
    delete:
      summary: Remove uma tarefa
      tags:
      - Tasks
      security:
      - bearerAuth: []
      responses:
        '204':
          description: tarefa removida com sucesso
        '404':
          description: tarefa não encontrada
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Redesign do Site
        description:
          type: string
          nullable: true
          example: Reformular toda a identidade visual
        color:
          type: string
          example: "#3b82f6"
        tasks_count:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - tasks_count
      - created_at
      - updated_at
    ProjectWithTasks:
      allOf:
      - "$ref": "#/components/schemas/Project"
      - type: object
        properties:
          tasks:
            type: array
            items:
              "$ref": "#/components/schemas/Task"
        required:
        - tasks
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        title:
          type: string
          example: Implementar autenticação
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - todo
          - in_progress
          - done
          example: todo
        position:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - title
      - status
      - position
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 3
        total_count:
          type: integer
          example: 42
        per_page:
          type: integer
          example: 20
      required:
      - current_page
      - total_pages
      - total_count
      - per_page
    Error:
      type: object
      properties:
        error:
          type: string
          example: Não autorizado.
      required:
      - error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token do usuário — obtido em GET /api/v1/me. Inclua como: Authorization:
        Bearer <token>'
security:
- bearerAuth: []
servers:
- url: http://localhost:3000
  description: Desenvolvimento local
